[package]
name = "mandelrust"
version = "0.1.0"
authors = ["André-Patrick Bubel <code@andre-bubel.de>"]
license = "GPL-3.0+"
edition = "2021"

[lib]
name = "mandelrust"
path = "src/lib.rs"
doc = false

[dependencies]
rug = { version = "1.26", features = ["float"] }
image = "0.25"
palette = "0.7"
rayon = "1.10"
num = "0.4"

